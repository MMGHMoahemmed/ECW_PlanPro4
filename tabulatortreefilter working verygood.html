<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tabulator Tree Filter</title>
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
</head>
<body>

    <button id="filter-apply">Apply Filters</button>
    <button id="filter-clear">Clear Filters</button>
    <div id="example-table"></div>

    <script type="text/javascript">
        //sample tree data
        const originalData = [
            {id:1, name:"Billy Bob", age:"12", gender:"male", height:1, col:"red", dob:"", _children:[
                {id:2, name:"Mary May", age:"1", gender:"female", height:2, col:"blue", dob:"14/05/1982"},
                {id:3, name:"Christine Lobowski", age:"42", height:0, col:"green", dob:"22/05/1982"},
                {id:4, name:"Brendon Philips", age:"125", gender:"male", height:1, col:"orange", dob:"01/08/1980", _children:[
                    {id:5, name:"Margret Marmajuke", age:"16", gender:"female", height:5, col:"yellow", dob:"31/01/1999"},
                    {id:6, name:"Frankenstein", age:"12", gender:"male", height:1, col:"red", dob:"", _children:[
                        {id:7, name:"Mary May", age:"1", gender:"female", height:2, col:"blue", dob:"14/05/1982"},
                        {id:8, name:"Christine Lobowski", age:"42", height:0, col:"green", dob:"22/05/1982"},
                        {id:9, name:"Brendon Philips", age:"125", gender:"male", height:1, col:"orange", dob:"01/08/1980"}
                    ]},
                ]},
            ]},
            {id:10, name:"Margret Marmajuke", age:"16", gender:"female", height:5, col:"yellow", dob:"31/01/1999"},
            {id:11, name:"Van Ng", age:"37", gender:"female", height:5, col:"yellow", dob:"31/01/1999"},
        ];

        //create Tabulator table
        var table = new Tabulator("#example-table", {
            data: originalData,
            dataTree:true,
            dataTreeStartExpanded:true,
            headerFilterLiveFilterDelay: 600, //delay filtering to allow for typing
            columns:[
                {title:"Name", field:"name", width:200, responsive:0, headerFilter:true, headerFilterPlaceholder:"filter by name..."},
                {title:"Age", field:"age", hozAlign:"left", formatter:"progress", headerFilter:true, headerFilterPlaceholder:"filter by age..."},
                {title:"Gender", field:"gender", headerFilter:true, headerFilterPlaceholder:"filter by gender..."},
                {title:"Height", field:"height", hozAlign:"center", headerFilter:true, headerFilterPlaceholder:"filter by height..."},
                {title:"Favourite Color", field:"col", headerFilter:true, headerFilterPlaceholder:"filter by color..."},
                {title:"Date Of Birth", field:"dob", hozAlign:"center", sorter:"date", headerFilter:true, headerFilterPlaceholder:"filter by dob..."},
            ],
        });

        // Function to check if a row matches all active filters
        function rowMatches(row, filters) {
            for(const filter of filters) {
                if (filter.value !== "") {
                    const rowValue = row[filter.field] ? String(row[filter.field]).toLowerCase() : "";
                    if (!rowValue.includes(filter.value.toLowerCase())) {
                        return false;
                    }
                }
            }
            return true;
        }

        // Recursive function to find all matching rows in the tree
        function findMatches(data, filters, matches) {
            for (const row of data) {
                if (rowMatches(row, filters)) {
                    const newRow = {...row};
                    delete newRow._children;
                    matches.push(newRow);
                }
                if (row._children) {
                    findMatches(row._children, filters, matches);
                }
            }
        }

        //Trigger filter when button is clicked
        document.getElementById("filter-apply").addEventListener("click", function(){
            const filters = table.getHeaderFilters();
            const activeFilters = filters.filter(f => f.value !== '');

            if (activeFilters.length === 0) {
                table.setData(originalData);
                table.options.dataTree = true;
                table.options.dataTreeStartExpanded = true;
            } else {
                const filteredData = [];
                findMatches(originalData, activeFilters, filteredData);
                table.options.dataTree = false;
                table.setData(filteredData);
            }
        });

        //Clear filters and restore original data
        document.getElementById("filter-clear").addEventListener("click", function(){
            table.clearHeaderFilter();
            table.setData(originalData);
            table.options.dataTree = true;
            table.options.dataTreeStartExpanded = true;
        });

    </script>

</body>
</html>
